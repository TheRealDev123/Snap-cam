<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SnapCam FIX2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;position:relative;background:#111;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
video.mir{transform:scaleX(-1)}
#top{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(#000a,transparent)}
#top button{width:44px;height:44px;border-radius:50%;border:0;background:#222;color:#fff;font-size:20px}
#top button.on{background:#FFFC00;color:#000}
#msg{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:99px;font-size:13px;white-space:nowrap;z-index:10;max-width:95vw;overflow:hidden}
#chips{position:absolute;top:96px;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:0 8px;overflow-x:auto;z-index:10}
#chips button{padding:8px 14px;border-radius:99px;border:1px solid #555;background:#000b;color:#fff;white-space:nowrap}
#chips button.on{background:#FFFC00;color:#000}
#start{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:20px;text-align:center}
#start button{background:#FFFC00;color:#000;border:0;padding:16px 28px;border-radius:99px;font-weight:900;font-size:17px}
#err{background:#331111;border:1px solid #844;padding:12px;border-radius:12px;font-size:13px;display:none;text-align:left;width:100%;max-width:340px}
#err.show{display:block}
#bottom{padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:#000;display:flex;flex-direction:column;gap:12px}
#zoomRow{display:flex;gap:6px;justify-content:center}
#zoomRow button{padding:9px 16px;border-radius:99px;border:1px solid #333;background:#1a1a1a;color:#fff}
#zoomRow button.on{background:#FFFC00;color:#000}
#row{display:flex;justify-content:space-between;align-items:center;padding:0 22px}
#thumb{width:58px;height:58px;border-radius:16px;background:#222;border:2px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}
#thumb img,#thumb video{width:100%;height:100%;object-fit:cover}
#shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid #111;box-shadow:0 0 0 3px #FFFC00}
#flip{width:58px;height:58px;border-radius:16px;background:#222;border:1px solid #444;color:#fff;font-size:22px}
#modes{display:flex;gap:6px;overflow-x:auto;padding:0 12px}
#modes button{padding:9px 15px;border-radius:99px;background:#1a1a1a;border:1px solid #333;color:#fff;white-space:nowrap}
#modes button.on{background:#FFFC00;color:#000}
#recBar{display:none;justify-content:center}
body.rec #recBar{display:flex}
body.rec #row{display:none}
body.rec #modes{display:none}
#recBar span{background:#f22;padding:7px 16px;border-radius:99px;font-weight:800}
#recBtns{display:none;justify-content:space-between;padding:0 22px}
body.rec #recBtns{display:flex}
#recBtns button{width:56px;height:56px;border-radius:14px;background:#222;color:#fff;border:0;font-size:20px}
#stopBtn{background:#f22 !important}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:99;white-space:nowrap}
</style>
</head>
<body>
<div id="view">
<video id="cam" autoplay playsinline muted></video>
<div id="top">
<button onclick="toggleTorch()" id="torchBtn">🔦</button>
<button onclick="location.reload()">↻</button>
</div>
<div id="msg">Tap Start Camera</div>
<div id="chips"></div>
<div id="start">
<h2>Tap to Start<br>Your Camera</h2>
<p style="color:#aaa;font-size:13px">Tap below, then tap Allow</p>
<button onclick="startCamera()">▶ START CAMERA • 4K</button>
<button onclick="showErr()" style="background:#222;color:#FFFC00;padding:10px 18px;border-radius:99px;font-size:13px">Show Error</button>
<div id="err"><b>Error:</b> <span id="errText">None yet</span></div>
</div>
<div style="position:absolute;bottom:10px;left:10px;background:#000a;padding:6px 10px;border-radius:99px;font-size:11px;z-index:10" id="resBadge">4K • Tap Start</div>
</div>
<div id="bottom">
<div id="recBar"><span id="recTime">00:00</span></div>
<div id="zoomRow"><button onclick="setZoom(0.5,this)">.5</button><button class="on" onclick="setZoom(1,this)">1×</button><button onclick="setZoom(2,this)">2</button><button onclick="setZoom(5,this)">5×</button></div>
<div id="row">
<div id="thumb" onclick="openTop()">Gallery</div>
<button id="shutter" onclick="shutterAction()"></button>
<button id="flip" onclick="switchCam()">⇄</button>
</div>
<div id="recBtns"><button onclick="togglePause()" id="pauseBtn">⏸</button><button id="stopBtn" onclick="stopVideo()">⏹</button><button onclick="takePhoto()">📷</button></div>
<div id="modes">
<button onclick="setMode('photo',this)" class="on">Photo</button>
<button onclick="setMode('video',this)">Video</button>
<button onclick="setMode('night',this)">Night</button>
<button onclick="setMode('portrait',this)">Portrait</button>
<button onclick="setMode('long',this)">Long Exp</button>
</div>
</div>
<div id="toast"></div>
<canvas id="cap" style="display:none"></canvas>
<script>
var stream=null,mode='photo',torchOn=false,recording=false,paused=false,rec=null,chunks=[],timer=null,secs=0,lastErr='',cams=[],camIdx=0,zoom=1,vid=document.getElementById('cam'),gallery=[];
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
function setMsg(m){document.getElementById('msg').textContent=m}
function showErr(){document.getElementById('err').classList.add('show');document.getElementById('errText').textContent=lastErr||'No error yet. Tap START.'}
function safeLabel(d){if(!d) return '';return d.label||''}
function nameFor(d,i){var l=safeLabel(d).toLowerCase();if(l.indexOf('front')>=0||l.indexOf('selfie')>=0)return '🤳 Front';if(l.indexOf('ultra')>=0)return '🌐 Ultra Wide';if(l.indexOf('tele')>=0)return '🔭 Tele';if(l.indexOf('macro')>=0)return '🔬 Macro';if(l.indexOf('back')>=0||l.indexOf('rear')>=0)return '📷 Back';if(!d) return '📷 Camera';return '📷 Cam '+(i+1)}
function isFront(d){if(!d) return false;var l=safeLabel(d).toLowerCase();return l.indexOf('front')>=0||l.indexOf('selfie')>=0}
async function listCams(){
try{
var all=await navigator.mediaDevices.enumerateDevices();
cams=all.filter(function(d){return d.kind==='videoinput'});
var w=document.getElementById('chips');w.innerHTML='';
cams.forEach(function(d,i){
var b=document.createElement('button');b.textContent=nameFor(d,i);if(i===camIdx)b.className='on';
b.onclick=function(){camIdx=i;startCamera()};
w.appendChild(b);
});
}catch(e){}
}
async function startCamera(){
setMsg('Starting... tap Allow');
try{
if(!window.isSecureContext){lastErr='Not HTTPS - must be https://';showErr();return}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){lastErr='Browser does not support camera';showErr();return}
var dev=cams[camIdx];
var cons;
if(dev&&dev.deviceId){cons={video:{deviceId:{exact:dev.deviceId},width:{ideal:3840},height:{ideal:2160}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}}
else{cons={video:{facingMode:'environment',width:{ideal:3840},height:{ideal:2160}},audio:true}}
var ns;
try{ns=await navigator.mediaDevices.getUserMedia(cons)}
catch(e){ns=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}
if(recording&&stream){
var nv=ns.getVideoTracks()[0];var ov=stream.getVideoTracks()[0];
if(ov)ov.stop();stream.removeTrack(ov);stream.addTrack(nv);
vid.srcObject=stream;vid.muted=true;await vid.play().catch(function(){});
vid.classList.toggle('mir',isFront(dev));
toast('Switched - still recording');return;
}
if(stream){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}}
stream=ns;vid.srcObject=stream;vid.muted=true;
await vid.play().catch(function(){});
vid.classList.toggle('mir',isFront(dev));
document.getElementById('start').style.display='none';
var w=vid.videoWidth||0;var h=vid.videoHeight||0;
var res=(w>=3000?'4K '+w+'x'+h:w>=1900?'1080p '+w+'x'+h:w+'x'+h);
document.getElementById('resBadge').textContent=res;
setMsg('ON - '+res+' - '+nameFor(dev,camIdx));
await listCams();
toast('Camera ON '+res);
}catch(err){
lastErr=err.name+': '+err.message;
setMsg('Blocked - tap Show Error');
showErr();
}
}
async function switchCam(){
if(cams.length>1){camIdx=(camIdx+1)%cams.length;startCamera();return}
camIdx=0;startCamera();
}
function setMode(m,btn){
mode=m;
document.querySelectorAll('#modes button').forEach(function(b){b.classList.remove('on')});
if(btn)btn.classList.add('on');
toast(m);
}
function setZoom(z,btn){
zoom=z;
document.querySelectorAll('#zoomRow button').forEach(function(b){b.classList.remove('on')});
if(btn)btn.classList.add('on');
if(stream){
var t=stream.getVideoTracks()[0];
try{var c=t.getCapabilities();if(c.zoom){t.applyConstraints({advanced:[{zoom:z}]});return}}catch(e){}
}
vid.style.transform='scale('+(1+(z-1)*0.15)+')'+(vid.classList.contains('mir')?' scaleX(-1)':'');
}
async function toggleTorch(){
if(!stream){toast('Start camera first');return}
torchOn=!torchOn;
document.getElementById('torchBtn').classList.toggle('on',torchOn);
try{
var t=stream.getVideoTracks()[0];var c=t.getCapabilities();
if(c.torch){await t.applyConstraints({advanced:[{torch:torchOn}]});toast(torchOn?'Flashlight ON':'Flashlight OFF');return}
toast('Torch not supported on this camera - try Back camera');
}catch(e){toast('Torch not supported on this camera')}
}
function fileName(ext){var d=new Date();function p(n){return String(n).padStart(2,'0')}return 'SnapCam_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+'-'+p(d.getMinutes())+'-'+p(d.getSeconds())+'.'+ext}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function takePhoto(){
if(!stream){toast('Start camera first');return}
var cv=document.getElementById('cap');var ctx=cv.getContext('2d');
cv.width=vid.videoWidth||1920;cv.height=vid.videoHeight||1080;
if(vid.classList.contains('mir')){ctx.translate(cv.width,0);ctx.scale(-1,1)}
ctx.drawImage(vid,0,0,cv.width,cv.height);
cv.toBlob(function(blob){
var name=fileName('jpg');var url=URL.createObjectURL(blob);
gallery.unshift({type:'photo',url:url,blob:blob,name:name});
var th=document.getElementById('thumb');th.innerHTML='<img src="'+url+'">';
dl(blob,name);toast('Saved - tap thumbnail to open in Photos');
},'image/jpeg',0.98);
}
async function openTop(){
if(!gallery.length){toast('Take a photo first');return}
var it=gallery[0];
try{
var f=new File([it.blob],it.name,{type:it.blob.type});
if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'SnapCam'});toast('Share opened - tap Save to Photos');return}
}catch(e){}
dl(it.blob,it.name);toast('Downloaded - open from Photos app');
}
function shutterAction(){
if(mode==='photo'||mode==='portrait'||mode==='long'||mode==='night')takePhoto();
else if(recording)stopVideo();
else startVideo();
}
function startVideo(){
if(!stream){toast('Start camera first');return}
chunks=[];
var mime='video/webm;codecs=vp9,opus';
if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:25000000})}catch(e){rec=new MediaRecorder(stream)}
rec.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data)};
rec.onstop=function(){
var blob=new Blob(chunks,{type:'video/webm'});var name=fileName('webm');var url=URL.createObjectURL(blob);
gallery.unshift({type:'video',url:url,blob:blob,name:name});
document.getElementById('thumb').innerHTML='<video src="'+url+'" muted></video>';
dl(blob,name);toast('Video saved');
};
rec.start(250);recording=true;paused=false;
document.body.classList.add('rec');setMsg('RECORDING - flip works!');
secs=0;timer=setInterval(function(){if(paused)return;secs++;var m=String(Math.floor(secs/60)).padStart(2,'0');var s=String(secs%60).padStart(2,'0');document.getElementById('recTime').textContent=m+':'+s},1000);
}
function togglePause(){
if(!recording||!rec)return;
if(paused){rec.resume();paused=false;document.getElementById('pauseBtn').textContent='⏸';toast('Resumed')}
else{rec.pause();paused=true;document.getElementById('pauseBtn').textContent='▶';toast('Paused')}
}
function stopVideo(){
if(!rec)return;try{rec.stop()}catch(e){}recording=false;clearInterval(timer);document.body.classList.remove('rec');setMsg('Stopped - saved');toast('Stopped');
}
window.addEventListener('error',function(e){lastErr=e.message});
</script>
</body>
</html>
